<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Runner Pro</title>
    <style>
        :root {
            --bg-color: #1e1e1e;
            --panel-bg: #252526;
            --text-color: #d4d4d4;
            --accent-color: #007acc;
            --border-color: #3c3c3c;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
        }

        .container {
            display: flex;
            height: 100vh;
            flex-direction: row;
        }

        /* エディタセクション */
        .editor-side {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border-color);
            min-width: 300px;
        }

        .toolbar {
            background-color: var(--panel-bg);
            padding: 8px 15px;
            display: flex;
            gap: 12px;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .toolbar label { font-size: 12px; color: #888; margin-right: auto; }

        textarea {
            flex: 1;
            background-color: #1e1e1e;
            color: #dcdcdc;
            border: none;
            padding: 15px;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.5;
            resize: none;
            outline: none;
        }

        /* プレビューセクション */
        .preview-side {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: white;
            position: relative;
        }

        iframe {
            flex: 1;
            border: none;
            background-color: white;
        }

        /* コンソール */
        .console-panel {
            height: 150px;
            background-color: #000;
            color: #eee;
            font-family: 'Consolas', monospace;
            font-size: 12px;
            border-top: 1px solid var(--border-color);
            overflow-y: auto;
        }

        .console-line {
            border-bottom: 1px solid #222;
            padding: 4px 10px;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .log-info { color: #00ff00; }
        .log-error { color: #ff5555; }

        /* UIパーツ */
        .btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 5px 15px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 12px;
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.8; }

        /* 控えめな終了ボタン */
        .exit-fs-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.05);
            color: rgba(0, 0, 0, 0.3);
            border: none;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 24px;
            z-index: 9999;
            transition: all 0.3s;
        }
        .exit-fs-btn:hover {
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
        }

        /* フルスクリーン表示の切り替え */
        .fullscreen-mode .editor-side,
        .fullscreen-mode .console-panel {
            display: none;
        }
        .fullscreen-mode .exit-fs-btn {
            display: flex;
        }
    </style>
</head>
<body>

<div class="container" id="mainContainer">
    <div class="editor-side">
        <div class="toolbar">
            <button class="btn" onclick="runCode()">Run</button>
            <button class="btn" onclick="toggleFullscreen()">Full Screen</button>
            <label>Ctrl + Enter</label>
            <button class="btn" style="background: #444;" onclick="clearConsole()">Clear Logs</button>
        </div>
        <textarea id="codeEditor" spellcheck="false"><!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <!-- 外部CSS(URL)の読み込み例 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding: 30px; }
        .preview-box { border: 2px dashed #ccc; padding: 20px; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <div class="preview-box">
            <h2 class="mb-4">External Resource & Dialog Test</h2>
            <p>外部CDN(Bootstrap)とJavaScriptダイアログのテストです。</p>
            
            <div class="d-flex justify-content-center gap-2">
                <button class="btn btn-primary" onclick="testAlert()">alert()</button>
                <button class="btn btn-success" onclick="testConfirm()">confirm()</button>
                <button class="btn btn-info" onclick="testPrompt()">prompt()</button>
            </div>
            
            <div class="mt-4">
                <img src="https://picsum.photos/200/100" alt="Random Image" class="rounded shadow">
                <p class="text-muted mt-2">外部画像読み込み</p>
            </div>
        </div>
    </div>

    <script>
        function testAlert() {
            alert("これは標準のアラートです。");
            console.log("alertを表示しました");
        }

        function testConfirm() {
            const result = confirm("実行しますか？");
            console.log("confirm結果:", result);
        }

        function testPrompt() {
            const name = prompt("お名前は？", "Guest");
            console.log("prompt入力内容:", name);
        }

        console.log("Runner Ready: 外部リソースを読み込みました。");
    </script>
</body>
</html></textarea>
    </div>

    <div class="preview-side">
        <button class="exit-fs-btn" onclick="toggleFullscreen()" title="Close Full Screen">&times;</button>
        <!-- 
            sandbox属性に allow-modals を入れることで alert() 等が可能になる 
            allow-popups を入れることで window.open 等が可能になる
        -->
        <iframe id="previewIframe" sandbox="allow-modals allow-forms allow-popups allow-scripts allow-same-origin"></iframe>
        <div class="console-panel" id="consolePanel"></div>
    </div>
</div>

<script>
    const codeEditor = document.getElementById('codeEditor');
    const previewIframe = document.getElementById('previewIframe');
    const consolePanel = document.getElementById('consolePanel');
    const mainContainer = document.getElementById('mainContainer');

    // console.log のフック
    const consoleProxyScript = `
        <script>
            (function() {
                const format = (arg) => {
                    if (typeof arg === 'object') {
                        try { return JSON.stringify(arg); } catch(e) { return String(arg); }
                    }
                    return String(arg);
                };
                const send = (type, args) => {
                    window.parent.postMessage({type, content: args.map(format).join(' ')}, '*');
                };
                console.log = (...args) => { send('log', args); };
                console.error = (...args) => { send('error', args); };
                console.warn = (...args) => { send('log', ['[WARN]', ...args]); };
                window.onerror = (m, s, l) => { send('error', [m + " (line:" + l + ")"]); };
            })();
        <\/script>
    `;

    function runCode() {
        const code = codeEditor.value;
        if (previewIframe.src) URL.revokeObjectURL(previewIframe.src);
        
        // headの直後にproxyスクリプトを差し込む
        const finalHtml = code.includes('<head>') 
            ? code.replace('<head>', '<head>' + consoleProxyScript)
            : consoleProxyScript + code;

        const blob = new Blob([finalHtml], { type: 'text/html' });
        previewIframe.src = URL.createObjectURL(blob);
    }

    window.addEventListener('message', (e) => {
        if (e.data.type === 'log') appendConsole(e.data.content, 'log-info');
        if (e.data.type === 'error') appendConsole(e.data.content, 'log-error');
    });

    function appendConsole(msg, cls) {
        const div = document.createElement('div');
        div.className = 'console-line ' + cls;
        div.textContent = '> ' + msg;
        consolePanel.appendChild(div);
        consolePanel.scrollTop = consolePanel.scrollHeight;
    }

    function clearConsole() {
        consolePanel.innerHTML = '';
    }

    function toggleFullscreen() {
        mainContainer.classList.toggle('fullscreen-mode');
    }

    window.addEventListener('keydown', (e) => {
        if (e.ctrlKey && e.key === 'Enter') runCode();
        if (e.key === 'Escape' && mainContainer.classList.contains('fullscreen-mode')) {
            toggleFullscreen();
        }
    });

    // 初期実行
    runCode();
</script>

</body>
</html>
