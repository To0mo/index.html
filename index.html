<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HTML Runner</title>
    <style>
        @font-face {
            font-family: 'SF Mono Bold';
            src: url('https://github.com/supercomputra/SF-Mono-Font/raw/refs/heads/master/SFMono-Bold.otf');
        }

        :root {
            --bg-color: #1a1a1a;
            --panel-bg: #222222;
            --text-color: #efefef;
            --accent-color: #007acc;
            --border-color: #333;
        }

        /* モバイルでキーボードが出てもスクロールさせない設定 */
        html, body {
            margin: 0;
            padding: 0;
            height: 100dvh;
            width: 100%;
            overflow: hidden;
            position: fixed; 
            background-color: var(--bg-color);
            font-family: -apple-system, sans-serif;
        }

        .container {
            display: flex;
            flex-direction: row;
            height: 100dvh;
            width: 100vw;
        }

        .editor-side {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border-color);
            min-width: 0; /* flex項目の縮小許可 */
        }

        .toolbar {
            background-color: var(--panel-bg);
            padding: 5px 10px;
            display: flex;
            gap: 8px;
            border-bottom: 1px solid var(--border-color);
        }

        textarea {
            flex: 1;
            background-color: #1a1a1a;
            color: #dcdcdc;
            border: none;
            padding: 15px;
            font-family: 'SF Mono Bold', 'Consolas', monospace;
            font-size: 14px;
            resize: none;
            outline: none;
            tab-size: 4;
        }

        .preview-side {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: white;
            position: relative;
            min-width: 0;
        }

        iframe {
            flex: 1;
            border: none;
            background-color: white;
        }

        .console-panel {
            height: 120px;
            background-color: #000;
            color: #00ff00;
            font-family: 'SF Mono Bold', monospace;
            font-size: 11px;
            border-top: 1px solid var(--border-color);
            overflow-y: auto;
        }

        .console-line {
            padding: 2px 10px;
            border-bottom: 1px solid #111;
            white-space: pre-wrap;
        }

        /* UI部品 */
        button.btn {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
        }

        /* 控えめな×ボタン */
        .exit-fs-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 24px;
            height: 24px;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.05);
            color: #999;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            z-index: 1000;
            font-size: 18px;
            transition: 0.2s;
        }
        .exit-fs-btn:hover { background: rgba(0,0,0,0.2); color: #333; }

        /* フルスクリーン表示切替 */
        .fullscreen-mode .editor-side,
        .fullscreen-mode .console-panel {
            display: none;
        }
        .fullscreen-mode .exit-fs-btn {
            display: flex;
        }
    </style>
</head>
<body>

<div class="container" id="mainContainer">
    <div class="editor-side">
        <div class="toolbar">
            <button class="btn" onclick="runCode()">Run</button>
            <button class="btn" onclick="toggleFullscreen()">Full</button>
            <button class="btn" style="background:#444;" onclick="clearConsole()">Clear</button>
        </div>
        <textarea id="codeEditor" spellcheck="false" placeholder="Enter HTML/JS here..."></textarea>
    </div>

    <div class="preview-side">
        <button class="exit-fs-btn" onclick="toggleFullscreen()">&times;</button>
        <iframe id="previewIframe" sandbox="allow-modals allow-forms allow-popups allow-scripts allow-same-origin"></iframe>
        <div class="console-panel" id="consolePanel"></div>
    </div>
</div>

<script>
    const codeEditor = document.getElementById('codeEditor');
    const previewIframe = document.getElementById('previewIframe');
    const consolePanel = document.getElementById('consolePanel');
    const mainContainer = document.getElementById('mainContainer');

    const consoleProxyScript = `
        <script>
            (function() {
                const format = (arg) => (typeof arg === 'object') ? JSON.stringify(arg) : String(arg);
                const send = (type, args) => window.parent.postMessage({type, content: args.map(format).join(' ')}, '*');
                console.log = (...args) => send('log', args);
                console.error = (...args) => send('error', args);
                window.onerror = (m, s, l) => send('error', [m + " (line:" + l + ")"]);
            })();
        <\/script>
    `;

    function runCode() {
        const code = codeEditor.value;
        if (previewIframe.src) URL.revokeObjectURL(previewIframe.src);
        
        // 外部URLの読み込みやalertが動くよう、適切な構造でBlob化
        const finalHtml = code.includes('<head>') 
            ? code.replace('<head>', '<head>' + consoleProxyScript)
            : consoleProxyScript + code;

        const blob = new Blob([finalHtml], { type: 'text/html' });
        previewIframe.src = URL.createObjectURL(blob);
    }

    window.addEventListener('message', (e) => {
        if (e.data.type === 'log' || e.data.type === 'error') {
            const div = document.createElement('div');
            div.className = 'console-line' + (e.data.type === 'error' ? ' log-error' : '');
            div.textContent = '> ' + e.data.content;
            consolePanel.appendChild(div);
            consolePanel.scrollTop = consolePanel.scrollHeight;
        }
    });

    function clearConsole() { consolePanel.innerHTML = ''; }

    function toggleFullscreen() {
        mainContainer.classList.toggle('fullscreen-mode');
    }

    window.addEventListener('keydown', (e) => {
        if (e.ctrlKey && e.key === 'Enter') runCode();
        if (e.key === 'Escape' && mainContainer.classList.contains('fullscreen-mode')) toggleFullscreen();
    });

    // 初期化時は空で実行
    runCode();
</script>

</body>
</html>
